apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudstarter
spec:
  ingressClassName: nginx
  rules:
    - host: cloudstarter.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudstarter
                port:
                  number: 80