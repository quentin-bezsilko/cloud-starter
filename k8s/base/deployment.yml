apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudstarter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudstarter
  template:
    metadata:
      labels:
        app: cloudstarter
    spec:
      containers:
        - name: cloudstarter
          image: cloudstarter:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: cloudstarter-config
            - secretRef:
                name: cloudstarter-secret
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"